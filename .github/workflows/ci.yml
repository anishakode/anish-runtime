name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:scope
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:evidence
      # Fails if any public claim moved without a change-control entry (M25).
      - run: pnpm freeze:check
      - run: pnpm test:status
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm exec playwright install --with-deps chromium
      # Runs against `next start`, so CSP, security headers, and the noindex
      # policy are asserted on a real production build.
      - run: pnpm test:e2e
        env:
          CI: true
          E2E_PROD: "1"
