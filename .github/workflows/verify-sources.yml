name: Verify sources

# The freeze (M25) proves a claim has not changed locally. It cannot know that a
# cited repository was renamed or a file moved, which would leave the site
# presenting a 404 as proof. This notices.
#
# Kept out of CI on purpose: it depends on the network and on GitHub being up,
# and a check that goes red for reasons unrelated to correctness is one people
# learn to ignore.

on:
  schedule:
    # Mondays, 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check every cited source still resolves
        id: verify
        run: pnpm verify:sources | tee verify-output.txt

      - name: Open an issue when the proof trail breaks
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // Deliberately thin. The logic lives in a module so it can be
            // tested — this branch only ever runs when the proof trail is
            // already broken, which is the one moment it has to work.
            const fs = require("fs");
            const { pathToFileURL } = require("url");
            const { reportProvenanceFailure } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/scripts/provenance-issue.mjs`,
              ).href
            );

            const result = await reportProvenanceFailure({
              github,
              context,
              readOutput: () => fs.readFileSync("verify-output.txt", "utf8"),
            });
            core.info(`Provenance issue: ${result}`);
