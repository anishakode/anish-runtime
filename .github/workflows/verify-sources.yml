name: Verify sources

# The freeze (M25) proves a claim has not changed locally. It cannot know that a
# cited repository was renamed or a file moved, which would leave the site
# presenting a 404 as proof. This notices.
#
# Kept out of CI on purpose: it depends on the network and on GitHub being up,
# and a check that goes red for reasons unrelated to correctness is one people
# learn to ignore.

on:
  schedule:
    # Mondays, 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check every cited source still resolves
        id: verify
        run: pnpm verify:sources | tee verify-output.txt

      - name: Open an issue when the proof trail breaks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let output = "(no output captured)";
            try {
              output = fs.readFileSync("verify-output.txt", "utf8").slice(-8000);
            } catch {}

            const title = "Provenance failure: a cited source no longer resolves";

            // Don't stack a new issue every week on the same breakage.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "provenance",
            });
            if (existing.data.some((issue) => issue.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["provenance"],
              body: [
                "`pnpm verify:sources` failed, so the site is citing at least one source",
                "that no longer resolves. Visitors following the proof trail hit a dead link.",
                "",
                "Either re-pin the source through change control, or remove the claim that",
                "depends on it. Do not silently drop the link — the claim is what the link",
                "was supporting.",
                "",
                "```",
                output,
                "```",
                "",
                `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join("\n"),
            });
